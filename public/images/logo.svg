<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" fill="none" class="matal-logo">
  <!-- Brand Emblem Mark -->
  <g transform="translate(10, 5)">
    <!-- Outer decorative badge ring -->
    <circle cx="30" cy="30" r="28" fill="#164E63" />
    <circle cx="30" cy="30" r="26" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 2" fill="none" />
    
    <!-- Sun -->
    <circle cx="38" cy="18" r="7" fill="#F59E0B" />
    
    <!-- Mountain Silhouettes -->
    <path d="M12 40 L24 24 L34 38 Z" fill="#0E7490" />
    <path d="M26 40 L38 20 L50 39 Z" fill="#0891B2" />
    <path d="M30 20 L38 20 L40 24 L34 26 Z" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Palm Tree on side -->
    <path d="M18 42 Q19 28 20 22" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Fronds -->
    <path d="M20 22 Q14 18 10 21" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M20 22 Q24 16 28 19" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M20 22 Q19 14 20 12" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M20 22 Q13 23 11 27" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" fill="none" />
    
    <!-- Waves / Sea at bottom -->
    <path d="M10 42 C16 40 22 45 28 42 C34 40 40 45 46 42 C49 40 51 41 52 42" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M12 46 C18 44 24 49 30 46 C36 44 42 49 48 46" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography: مَطَلّ & MATAL in Alexandria and Inter -->
  <g transform="translate(85, 42)">
    <text font-family="'Alexandria', 'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="900" fill="#164E63" letter-spacing="-0.5">
      مَطَلّ
    </text>
    <text y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#06B6D4" letter-spacing="4">
      MATAL
    </text>
  </g>
</svg>
